<main class="auth-shell" data-launcher data-product="warden" data-default-host="localhost" data-default-port="7332">
  <form class="login-card" data-config novalidate>
    <div class="brand"><span>W</span><strong>Warden</strong></div>
    <div class="error" data-error role="alert" hidden></div>
    <label>Domain or IP<input name="host" value="localhost" placeholder="localhost or https://warden.example.com" autocomplete="url" spellcheck="false"></label>
    <label>Port<input name="port" type="number" min="1" max="65535" value="7332" inputmode="numeric"></label>
    <div class="actions"><button type="submit">Save</button><button type="button" class="secondary" data-defaults>Use defaults</button></div>
    <button type="button" class="secondary open" data-open>Open</button>
  </form>
</main>
